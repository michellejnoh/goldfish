<style>
@font-face{font-family:"Archivo Narrow";font-weight:400;font-display:swap;src:url(fonts/archivo-narrow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo Narrow";font-weight:500;font-display:swap;src:url(fonts/archivo-narrow-latin-500-normal.woff2) format("woff2")}
/* Layout: a full-screen white tank; name + needs float top-left, sound top-right, tools along the bottom. Monotone UI; only the fish and its things carry color. */
:root{
  --ink:#111111; --dim:#a3a3a3; --soft:#6b6b6b; --track:#dedede; --bg:#ffffff;
  --font:"Archivo Narrow","Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
#dark{position:fixed;inset:0;background:#0c0c0f;opacity:0;transition:opacity 1.2s ease;pointer-events:none;z-index:1}
body.night #dark{opacity:.55}
#say{position:fixed;left:0;top:0;z-index:2;pointer-events:none;color:#3a3a3a;font:500 24px/1 var(--font);letter-spacing:.03em;white-space:nowrap;
  filter:blur(1px);opacity:0;transition:opacity .4s;transform:translate(-50%,-100%)}
.ui{position:fixed;left:0;right:0;z-index:3;pointer-events:none;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  text-shadow:0 0 1.2px rgba(0,0,0,.3)}
.ui > *{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who{display:flex;flex-direction:column;gap:9px;min-width:0}
#name{font:500 40px/1 var(--font);letter-spacing:-.01em;color:var(--ink);background:transparent;border:0;padding:0;margin:0;width:8ch;
  -webkit-user-select:text;user-select:text;text-shadow:inherit}
#name:focus{outline:none;border-bottom:1px solid var(--ink)}
.stats{display:grid;grid-template-columns:auto 84px;column-gap:12px;row-gap:5px;align-items:center}
.stats span{font-size:14px;color:var(--soft);letter-spacing:.02em}
.stats b{display:block;height:2px;background:var(--track);position:relative;overflow:hidden}
.stats b i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .5s ease}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-shadow:inherit}
.mini{font-size:15px;color:var(--soft);padding:6px 0;letter-spacing:.02em}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;align-items:center;gap:2px}
#cap{pointer-events:none;margin:0;font-size:16px;color:var(--soft);text-align:center;min-height:1.3em;max-width:34ch;letter-spacing:.01em}
.tools{display:flex;justify-content:space-between;width:100%;max-width:440px}
.tools button{font-size:24px;letter-spacing:.005em;color:var(--dim);padding:12px 6px;min-width:44px}
.tools button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:6px}
button:focus-visible,#name:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
body.night{--ink:#ededed;--dim:#7d7d7d;--soft:#b3b3b3;--track:#4a4a4a}
body.night #say{color:#e0e0e0}
@media (min-width:700px){#name{font-size:46px}}
[hidden]{display:none!important}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.sheet{position:fixed;inset:0;z-index:6;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;
  padding-block:24px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));text-shadow:0 0 1.2px rgba(0,0,0,.28);color:#111}
.card{max-width:340px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.card h2{font:500 32px/1.05 var(--font);margin:0;letter-spacing:-.01em}
.card p{margin:0;font-size:16px;color:#6b6b6b;line-height:1.4}
.card input{font:500 24px var(--font);border:0;border-bottom:1px solid #111;border-radius:0;padding:6px 0;background:transparent;color:#111;-webkit-user-select:text;user-select:text;width:100%}
.card input:focus{outline:none}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.go{font-size:24px;color:#111;padding:6px 0}
.link{font-size:16px;color:#6b6b6b;text-decoration:underline;text-underline-offset:4px;padding:6px 0}
.mis{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;font-size:17px}
.mis span{color:#111}.mis em{font-style:normal;color:#6b6b6b;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.mis .done{color:#a3a3a3;text-decoration:line-through}
.small{font-size:14px;color:#8a8a8a}
</style>
</head>
<body>

<canvas id="c" aria-label="Goldfish tank. Tap, drag and feed to interact."></canvas>
<div id="dark"></div>
<div id="say" aria-live="polite"></div>
<div class="ui top">
  <div class="who">
    <input id="name" maxlength="14" aria-label="Fish name" spellcheck="false" autocomplete="off">
    <div class="stats" id="stats"></div>
  </div>
  <div class="side"><button class="mini" id="who">keeper</button><button class="mini" id="misBtn">missions</button><button class="mini" id="snd">sound on</button></div>
</div>
<div class="ui bottom">
  <p id="cap" aria-live="polite"></p>
  <nav class="tools" id="tools" aria-label="Tools"></nav>
</div>

<div class="sheet" id="login" hidden>
  <form class="card" id="loginForm">
    <h2>who's keeping this fish?</h2>
    <p id="loginNote">Pick a username. Your fish, its level and missions are saved under it.</p>
    <input id="loginName" maxlength="16" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Username" placeholder="username">
    <p class="small" id="loginMsg">letters, numbers and _ · 2 to 16 characters</p>
    <div class="row2"><button type="button" class="link" id="loginBack" hidden>pick another</button><span></span><button type="submit" class="go" id="loginGo">start</button></div>
  </form>
</div>
<div class="sheet" id="missions" hidden>
  <div class="card">
    <h2 id="misTitle">level 1</h2>
    <p id="misXp"></p>
    <p class="small">today</p>
    <div class="mis" id="misList"></div>
    <p class="small" id="misStreak"></p>
    <p class="small">achievements</p>
    <div class="mis" id="achList"></div>
    <div class="row2"><span></span><button type="button" class="go" id="misClose">close</button></div>
  </div>
</div>
<script src="firebase-config.js"></script>
<script src="vendor/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const V3=THREE.Vector3;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,l,dt)=>a+(b-a)*(1-Math.exp(-l*dt));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const C=h=>new THREE.Color(h);
const mix=(a,b,t)=>a.clone().lerp(b,clamp(t));
const n3=(x,y,z)=>(Math.sin(x*1.7+Math.sin(y*2.3))+Math.sin(y*1.9+Math.sin(z*2.9))+Math.sin(z*2.3+Math.sin(x*1.3)))/3;

/* ================= text ================= */
const DEF='Kumquat',WORDS=['blub','blub blub','o','o  o','· °'];
const HINT={hand:'drag to lead · tap to call · tap the fish to say hi',food:'tap to sprinkle flakes',wash:'wipe the glass',toy:'drag the lure'};
const MOOD={food:'{n} is nosing at the surface.',clean:'The glass is getting cloudy.',energy:'{n} is drifting low.',fun:'{n} is pacing the glass.',ok:'{n} is gliding around.'};
const STATS=[['food','full'],['clean','clean'],['energy','energy'],['fun','fun']];
const RATE={food:1.3,clean:0.6,energy:0.7,fun:1.0}; // per minute

/* ================= save ================= */
function normalizeSave(sv){if(!sv||!sv.pets)sv={pets:{}};for(const k in sv.pets)if(k!=='fish')delete sv.pets[k];
  if(!sv.pets.fish)sv.pets.fish={name:DEF,s:{food:70,clean:80,energy:75,fun:60},born:Date.now(),last:Date.now()};
  const p=sv.pets.fish,away=Math.min((Date.now()-p.last)/1000,48*3600);for(const s in RATE)p.s[s]=clamp(p.s[s]-RATE[s]*away/60,0,100);
  if(sv.night)p.s.energy=clamp(p.s.energy+RATE.energy*away/60+away*1.2,0,100);p.last=Date.now();
  sv.cur='fish';if(sv.sound===undefined)sv.sound=true;return sv;}
let save=normalizeSave(null);
const pet=()=>save.pets.fish;
const fill=t=>t.replace(/\{n\}/g,pet().name);
const add=(k,v)=>{const s=pet().s;s[k]=clamp(s[k]+v,0,100);};

/* ================= sound ================= */
const snd={ctx:null,
  ac(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
  osc(fs,dur,vol,delay){const a=this.ctx;if(!a||!save.sound)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type='sine';
    o.frequency.setValueAtTime(fs[0],t);o.frequency.exponentialRampToValueAtTime(fs[1],t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.03,dur*0.2));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);},
  blub(){this.osc([240,820],0.13,0.11);if(Math.random()<0.5)this.osc([300,1000],0.1,0.07,0.12);},
  pop(){this.osc([700,1300],0.05,0.05);},
  wipe(){this.osc([1800,1500],0.06,0.015);}
};

/* ================= three setup ================= */
const cv=$('#c');
const LOWRES=0.8; // render below screen resolution for a soft, low-res look
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setClearColor(0xffffff,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,0.1,80);
const hemi=new THREE.HemisphereLight(0xffffff,0xece6df,0.9);scene.add(hemi);
const keyL=new THREE.DirectionalLight(0xffffff,0.7);keyL.position.set(2,5,4);scene.add(keyL);
const rimL=new THREE.DirectionalLight(0xffffff,0.35);rimL.position.set(-2,3,-4);scene.add(rimL);
let world=new THREE.Group();scene.add(world);

// flat 2D look: unlit, solid fills
function flatMat(o){o=Object.assign({},o);['roughness','metalness','envMap','envMapIntensity','bumpMap','bumpScale','emissive'].forEach(k=>delete o[k]);return new THREE.MeshBasicMaterial(o);}
const FISH_COL=0xff7a3c,FIN_COL=0xff8d4f;
const MAT=flatMat({vertexColors:true});
const MAT_FISH=flatMat({color:FISH_COL});
const MAT_FIN=flatMat({color:FIN_COL,side:THREE.DoubleSide});
const MAT_PLANT=flatMat({color:0xb9b9b9,side:THREE.DoubleSide});
const BLACK=new THREE.MeshBasicMaterial({color:0x0b0b0b});
const EYE_IRIS=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const g=x.createRadialGradient(128,128,58,128,128,128);g.addColorStop(0,'rgba(120,96,60,1)');g.addColorStop(0.14,'rgba(214,196,160,1)');g.addColorStop(0.45,'rgba(240,230,206,1)');g.addColorStop(0.7,'rgba(228,196,140,1)');g.addColorStop(0.86,'rgba(214,120,44,0.85)');g.addColorStop(1,'rgba(240,128,28,0)');
  x.fillStyle=g;x.beginPath();x.arc(128,128,128,0,7);x.fill();x.globalAlpha=0.18;x.strokeStyle='#5a3a12';x.lineWidth=1.4;
  for(let a=0;a<120;a++){const t=a/120*Math.PI*2+Math.sin(a)*0.02;x.beginPath();x.globalAlpha=0.1;x.moveTo(128+Math.cos(t)*62,128+Math.sin(t)*62);x.lineTo(128+Math.cos(t)*(86+6*Math.sin(a*3.7)),128+Math.sin(t)*(86+6*Math.sin(a*3.7)));x.stroke();}
  const tex=new THREE.CanvasTexture(c);return new THREE.MeshBasicMaterial({visible:false});})();
const EYE_PUPIL=new THREE.MeshBasicMaterial({color:0x111111,polygonOffset:true,polygonOffsetFactor:-6,polygonOffsetUnits:-6});
const EYE_CORNEA=flatMat({color:0xffffff,transparent:true,opacity:0.16,roughness:0.03,metalness:0.1,depthWrite:false});
const PROXY=new THREE.MeshBasicMaterial({visible:false});

function smoothNormals(g){g.computeVertexNormals();const p=g.attributes.position,n=g.attributes.normal,m=new Map();
  for(let i=0;i<p.count;i++){const k=Math.round(p.getX(i)*1e4)+'_'+Math.round(p.getY(i)*1e4)+'_'+Math.round(p.getZ(i)*1e4);let a=m.get(k);if(!a){a=[0,0,0,[]];m.set(k,a);}a[0]+=n.getX(i);a[1]+=n.getY(i);a[2]+=n.getZ(i);a[3].push(i);}
  m.forEach(a=>{const l=Math.hypot(a[0],a[1],a[2])||1;a[3].forEach(i=>n.setXYZ(i,a[0]/l,a[1]/l,a[2]/l));});n.needsUpdate=true;return g;}
function blob(ws,hs,def){const g=new THREE.SphereGeometry(1,ws,hs),p=g.attributes.position;
  for(let i=0;i<p.count;i++){const r=def(p.getX(i),p.getY(i),p.getZ(i));p.setXYZ(i,r[0],r[1],r[2]);}return smoothNormals(g);}
function tint(g,fn){const p=g.attributes.position,a=new Float32Array(p.count*3);for(let i=0;i<p.count;i++){const c=fn(p.getX(i),p.getY(i),p.getZ(i),i);a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}
  g.setAttribute('color',new THREE.BufferAttribute(a,3));return g;}
function finGeo(nu,nv,pf,cf,axis){const pos=[],col=[],flex=[],idx=[],uvs=[];
  for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++){const u=i/nu,v=j/nv,p=pf(u,v),c=cf(u,v);pos.push(p[0],p[1],p[2]);if(axis==='u')uvs.push(u,v);else uvs.push(v,u);col.push(c[0],c[1],c[2],c[3]);flex.push(p[3]===undefined?u:p[3]);}
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+nv+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,4));g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);g.computeVertexNormals();g.userData.flex=new Float32Array(flex);return g;}

/* ================= the goldfish ================= */
let R;
function buildFish(){
  const Or=C('#F2801C'),Dp=C('#D9501A'),Gd=C('#F7BE62'),Cr=C('#FCE4BE'),Rd=C('#E2461A');
  const O=[0.95,0.5,0.12],P=[0.99,0.72,0.47],Wh=[1,0.96,0.9];
  const R={g:new THREE.Group(),inner:new THREE.Group(),fins:[],wave:[],eyes:[]};R.g.add(R.inner);R.g.rotation.order='YZX';
  // a plump, kumquat-like body with a real goldfish profile: hump behind the head,
  // a snout that slopes down to the mouth, a deep belly and a smooth taper into the tail
  const L=0.72,Hh=0.37,Wd=0.25;
  // profile of a real goldfish: a blunt rounded head sloping to a terminal mouth, deepest just behind the head,
  // then a steady taper into a thick caudal peduncle that ends squarely where the tail grows out
  const Rp=u=>u>=0?Math.pow(Math.max(0,1-Math.pow(u,3)),0.36):Math.pow(Math.max(0,1-Math.pow(-u,7)),0.22);
  const tH=u=>u<0?1-0.64*Math.pow(-u,1.6):1;
  const tW=u=>u<0?1-0.66*Math.pow(-u,1.4):1-0.1*u*u;
  const hump=u=>0.05*Math.exp(-Math.pow((u-0.12)/0.4,2));
  const belly=u=>1+0.1*Math.exp(-Math.pow((u-0.02)/0.42,2));
  const hTop=u=>Hh*tH(u)*(1-0.3*Math.pow(Math.max(0,u),2))+hump(u);
  const hBot=u=>Hh*tH(u)*belly(u)*(1-0.38*Math.pow(Math.max(0,u),2));
  const shift=u=>0.035*Math.pow(Math.max(0,u),2)+0.02*Math.pow(Math.max(0,-u),2);
  const topY=x=>{const u=x/L;return Rp(u)*hTop(u)+shift(u);};
  const botY=x=>{const u=x/L;return Rp(u)*hBot(u)-shift(u);};
  const bg=blob(56,36,(u,y,z)=>{const r=Math.hypot(y,z)||1e-6,dy=y/r,dz=z/r,k=Rp(u);
    return [u*L,dy*k*(dy>0?hTop(u):hBot(u))+shift(u),dz*k*Wd*tW(u)*(1-0.32*dy)];});
  const Wt=C('#FFF3E2');
  tint(bg,(x,y,z)=>{let c=mix(Or,Dp,ss(0.04,0.3,y));c=mix(c,Gd,ss(0.02,-0.12,y)*0.8);c=mix(c,Wt,ss(-0.06,-0.26,y)*0.85);
    const gill=Math.exp(-Math.pow((x-0.32)/0.06,2))*ss(0.25,-0.1,y)*0.06;c=c.multiplyScalar(1-gill);
    return c;});
  {const uv=bg.attributes.uv,p=bg.attributes.position;for(let i=0;i<p.count;i++)uv.setX(i,(p.getX(i)/L+1)/2);uv.needsUpdate=true;}
  const body=new THREE.Mesh(bg,MAT_FISH);body.userData.part='body';R.inner.add(body);R.wave.push(bg);
  // eyes: a gold iris that softens into the scales, a dark pupil, and a clear glossy cornea
  const rc=new THREE.Raycaster(),ER=0.09;
  for(const s of [-1,1]){rc.set(new V3(0.46,0.09,2*s),new V3(0,0,-s));const h=rc.intersectObject(body)[0];if(!h)continue;
    const n=h.face.normal.clone().normalize();
    const ig=new THREE.CircleGeometry(ER,48,0,Math.PI*2);ig.translate(0,0,0);const tmp=new THREE.Object3D();tmp.position.copy(h.point);tmp.lookAt(h.point.clone().add(n));tmp.updateMatrix();
    ig.applyMatrix4(tmp.matrix);const ip=ig.attributes.position;
    for(let i=0;i<ip.count;i++){const v=new V3(ip.getX(i),ip.getY(i),ip.getZ(i));rc.set(v.clone().addScaledVector(n,0.3),n.clone().negate());const hh=rc.intersectObject(body)[0];if(hh){v.copy(hh.point).addScaledVector(n,0.003);ip.setXYZ(i,v.x,v.y,v.z);}}
    ig.computeVertexNormals();
    const iris=new THREE.Mesh(ig,EYE_IRIS);iris.userData.part='head';iris.renderOrder=1;R.inner.add(iris);
    const e=new THREE.Group();e.position.copy(h.point).addScaledVector(n,0.012);e.lookAt(h.point.clone().add(n));R.inner.add(e);
    const pup=new THREE.Group();pup.position.z=0.012;e.add(pup);
    const pm=new THREE.Mesh(new THREE.CircleGeometry(0.052,32),EYE_PUPIL);pm.renderOrder=2;pm.userData.part='head';pup.add(pm);
    const cg=new THREE.SphereGeometry(ER*0.86,40,12,0,Math.PI*2,0,Math.PI*0.32);cg.rotateX(Math.PI/2);cg.scale(1,1,0.9);cg.translate(0,0,-ER*0.86*Math.cos(Math.PI*0.32)*0.9);
    R.eyes.push({e,pup,s});}
  R.mouthObj=new THREE.Group();R.mouthObj.visible=false;R.mouthObj.position.set(L-0.014,shift(1)+0.006,0);R.inner.add(R.mouthObj);

/* ================= reactions ================= */

/* ================= behaviour ================= */

  if(S.catchCD<=0&&mouthWorld().distanceTo(tp)<0.24){S.catchCD=1.2;add('fun',6);react('caught');for(let i=0;i<3;i++)bubble(mouthWorld(),0.025);}

  if(S.think<=0){S.think=rnd(4,8);const r=Math.random();
    {const al=T-(S.lastTouch||0);if(al>12&&s.energy>15&&Math.random()<0.5){if(al>60&&Math.random()<0.6&&PEBBLES.some(p=>!p.inPile)){S.mode='tidy';S.modeT=45;S.tidyLeft=3+Math.floor(rnd(0,4));S.peb=null;}

  const row=(txt,right,done)=>'<span class="'+(done?'done':'')+'">'+txt+'</span><em>'+right+'</em>';
  $('#misList').innerHTML=d.ids.map(id=>{const m=MISSIONS.find(x=>x.id===id);return row(fill(m.t),d.done[id]?'done':(d.prog[id]||0)+'/'+m.g+' · '+m.xp+' xp',d.done[id]);}).join('')+row('all three',d.bonus?'done':'+50 xp',d.bonus);
  $('#misStreak').textContent=(PROG.streak.n||1)+' day'+(PROG.streak.n>1?'s':'')+' in a row · new missions at midnight';
  $('#achList').innerHTML=ACH.map(a=>row(a.t,PROG.ach[a.id]?'done':Math.min(a.g,a.ty==='streak'?PROG.streak.n:(PROG.life[a.ty]||0))+'/'+a.g,!!PROG.ach[a.id])).join('');}
$('#misBtn').onclick=()=>{renderMissions();$('#missions').hidden=false;};
$('#misClose').onclick=()=>{$('#missions').hidden=true;};
/* ---- start-up: last keeper on this device loads instantly, then the online copy if it's newer ---- */
{const last=(()=>{try{return localStorage.getItem('goldfish-user')}catch(e){return null}})();
  if(last&&NAME_RE.test(last)){USER=last;const local=readLocal(last);save=normalizeSave(local&&local.save);PROG=normProg(local&&local.prog);
    cloudGet(last).then(c=>{if(c&&(!local||c.updated>local.updated))adopt(c);},()=>{});}
  else{PROG=null;}}
setInterval(()=>{if(cloudDirty)cloudPut();},20000);

/* ================= loop ================= */
let uiT=0,saveT=0,algT=0;const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const nowF=performance.now(),busy=ptr.down||toy||foods.length||T-(S.lastTouch||-9)<4,minF=busy?0:(lightsOff&&S.asleep?62:30);
  if(nowF-(frame.last||0)<minF)return;frame.last=nowF;const dt=Math.min(clock.getDelta(),0.07);T+=dt;
  needs(dt);behave(dt);physics(dt);animate(dt);updateFoods(dt);updateToy(dt);updateRocks(dt);updateFX(dt);updateSay(dt);
  const lt=lightsOff?0.35:1;hemi.intensity=damp(hemi.intensity,0.85*lt,2,dt);keyL.intensity=damp(keyL.intensity,0.7*lt,2,dt);
  const d=camera.position.distanceTo(camLook);scene.fog.far=damp(scene.fog.far,d+lerp(3,40,pet().s.clean/100),2,dt);
  camera.position.x=camBase.x+Math.sin(T*0.17)*0.05;camera.position.y=camBase.y+Math.sin(T*0.23)*0.03;camera.lookAt(camLook);
  if((algT+=dt)>1){algT=0;syncAlgae();}
  if((uiT+=dt)>0.3){uiT=0;updateStats();updateCap();if(PROG){ensureDaily();const n=pet().s;if(n.food>60&&n.clean>60&&n.energy>60&&n.fun>60&&!S.happyOnce){S.happyOnce=true;track('needs');}}}
  if(S.toastT>0)S.toastT-=dt;
  if((saveT+=dt)>5){saveT=0;persist();}
  renderer.render(scene,camera);}
setup();
if(lightsOff){document.body.classList.add('night');S.asleep=true;S.pos.set(-B.x*0.5,B.ymin+0.05,-0.4);S.heading=S.wantH=0;hemi.intensity=0.3;keyL.intensity=0.25;renderUI();}else hint();
requestAnimationFrame(frame);
window.addEventListener('pagehide',()=>{persist();cloudPut(true);});
if(!USER)setTimeout(openLogin,600);else{ensureDaily();$('#who').textContent='@'+USER;}
// pick up new versions by itself: check the page now and then, and reload (keeping the fish's state) when it changes
(function(){let base=null;
  const check=()=>fetch(location.pathname+'?check='+Date.now(),{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)return;const v=r.headers.get('etag')||r.headers.get('last-modified');if(!v)return;
    if(base===null){base=v;return;}if(v===base)return;const go=()=>{if(ptr.down){setTimeout(go,1000);return;}persist();location.reload();};go();}).catch(()=>{});
  check();setInterval(check,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});})();
document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();cloudPut(true);}clock.getDelta();});
})();
