<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="body" cx="0.42" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#FFB24A"/>
      <stop offset="0.45" stop-color="#F2801C"/>
      <stop offset="1" stop-color="#D2491A"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#F7BE62" stop-opacity="0"/>
      <stop offset="1" stop-color="#FCE4BE" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fin" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F2801C" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FDB57C" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFF4E6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="dors" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E86A1E" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFE3C4" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="205" y1="0" x2="55" y2="0">
      <stop offset="0" stop-color="#F2801C" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#F9A35E" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#FDD3A8" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <g transform="translate(13 5)">
  <g filter="url(#soft)">
    <!-- flowing fan tail with a soft centre notch -->
    <path d="M200 238 C168 200 120 140 70 128 C58 150 66 172 60 190 C70 212 62 236 92 256 C62 276 70 300 60 322 C66 340 58 362 70 384 C120 372 168 312 200 278 Z" fill="url(#tail)"/>
    <g stroke="#E0701E" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M196 252 C160 210 120 170 82 146"/><path d="M196 254 C160 236 118 216 76 200"/>
      <path d="M196 258 C164 258 128 257 100 256"/><path d="M196 262 C160 280 118 298 76 312"/>
      <path d="M196 264 C160 306 120 344 80 368"/>
    </g>
    <!-- dorsal fin: a soft sail leaning back -->
    <path d="M318 150 C312 118 290 92 252 84 C228 82 206 90 194 102 C214 112 228 134 236 168 Z" fill="url(#dors)"/>
    <!-- pelvic and anal fins -->
    <path d="M326 356 C324 386 308 410 284 424 C290 400 290 380 288 362 Z" fill="#F59A4E" fill-opacity="0.8"/>
    <path d="M240 336 C230 364 210 384 186 396 C198 372 202 352 204 330 Z" fill="#F59A4E" fill-opacity="0.75"/>
    <!-- body: a plump dumpling -->
    <ellipse cx="300" cy="258" rx="128" ry="112" fill="url(#body)"/>
    <ellipse cx="300" cy="258" rx="128" ry="112" fill="url(#belly)"/>
    <ellipse cx="282" cy="200" rx="58" ry="30" fill="#ffffff" fill-opacity="0.32" transform="rotate(-14 282 200)"/>
  </g>
  <!-- eye -->
  <circle cx="378" cy="236" r="15" fill="#0b0b0b"/>
  </g>
</svg>
